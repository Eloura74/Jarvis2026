<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OMNI Interface</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN (temporaire - PostCSS v4 config à finaliser) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Configuration Tailwind CDN pour rendre la couleur 'cyan' dynamique via des variables CSS
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cyan: {
                50: "var(--theme-50, #ecfeff)",
                100: "var(--theme-100, #cffafe)",
                200: "var(--theme-200, #a5f3fc)",
                300: "var(--theme-300, #67e8f9)",
                400: "var(--theme-400, #22d3ee)",
                500: "var(--theme-500, #06b6d4)",
                600: "var(--theme-600, #0891b2)",
                700: "var(--theme-700, #0e7490)",
                800: "var(--theme-800, #155e75)",
                900: "var(--theme-900, #164e63)",
                950: "var(--theme-950, #083344)",
              },
            },
          },
        },
      };
    </script>

    <!-- Injection du Thème dès le chargement de la page pour éviter le clignotement -->
    <script>
      try {
        const storedSettings = localStorage.getItem("jarvis-settings");
        if (storedSettings) {
          const settings = JSON.parse(storedSettings);
          if (settings.theme) {
            document.documentElement.classList.add("theme-" + settings.theme);
          } else {
            document.documentElement.classList.add("theme-ironman");
          }
        } else {
          document.documentElement.classList.add("theme-ironman");
        }
      } catch (e) {
        console.error("Erreur parsing thème", e);
      }
    </script>

    <!-- PATCH SILENCIEUX: Suppression des erreurs d'extensions Chrome (Content.js) -->
    <script>
      window.addEventListener(
        "error",
        function (event) {
          if (
            event.message &&
            (event.message.includes("IndexSizeError") ||
              event.message.includes("getRangeAt") ||
              event.filename.includes("content.js"))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            console.debug(
              "🚫 Erreur extension Chrome supprimée:",
              event.message,
            );
            return true;
          }
        },
        true,
      );
    </script>

    <!-- Import Maps pour React et dépendances -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
          "react": "https://esm.sh/react@^19.2.4",
          "react/": "https://esm.sh/react@^19.2.4/",
          "react-dom": "https://esm.sh/react-dom@^19.2.4",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
          "framer-motion": "https://esm.sh/framer-motion@^11.11.11",
          "lucide-react": "https://esm.sh/lucide-react@^0.454.0",
          "recharts": "https://esm.sh/recharts@^3.7.0"
        }
      }
    </script>

    <!-- Styles personnalisés -->
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <!-- Effet scanline holographique -->
    <div class="scanline"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
