<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis Orb - High Fidelity UI</title>
    <style>
      :root {
        --bg-color: #050914;
        --panel-bg: #0a1128;
        --text-color: #e2e8f0;
        --accent: #00f0ff;
      }

      body {
        margin: 0;
        padding: 2rem;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        display: flex;
        flex-wrap: wrap;
        gap: 4rem;
        justify-content: center;
        max-width: 1200px;
        width: 100%;
      }

      /* Cadre matériel simulé de haute qualité */
      .hardware-bezel {
        width: 290px;
        height: 290px;
        background: radial-gradient(circle at 30% 30%, #2a2a35, #0a0a0f);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 30px 60px rgba(0, 0, 0, 0.8),
          inset 0 2px 4px rgba(255, 255, 255, 0.1),
          inset 0 -4px 10px rgba(0, 0, 0, 0.9);
        position: relative;
        border: 2px solid #111;
      }

      /* Reflet de la lentille en verre */
      .hardware-bezel::after {
        content: "";
        position: absolute;
        top: 2%;
        left: 5%;
        width: 90%;
        height: 90%;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.15) 0%,
          rgba(255, 255, 255, 0) 40%
        );
        pointer-events: none;
        z-index: 20;
      }

      canvas {
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background-color: #02050a;
        box-shadow: inset 0 0 30px rgba(0, 200, 255, 0.05);
        image-rendering: pixelated; /* Simule la netteté des pixels TFT */
      }

      /* Panneau de contrôle industriel */
      .controls {
        background-color: var(--panel-bg);
        padding: 2rem;
        border-radius: 12px;
        flex: 1;
        min-width: 340px;
        border: 1px solid #1e293b;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      h2 {
        font-weight: 400;
        color: var(--accent);
        border-bottom: 1px solid #1e293b;
        padding-bottom: 0.8rem;
        font-size: 1.2rem;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .button-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }

      button {
        background-color: #0f172a;
        color: #94a3b8;
        border: 1px solid #334155;
        padding: 0.6rem;
        border-radius: 4px;
        cursor: pointer;
        font-family: monospace;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      button:hover,
      button.active {
        background-color: rgba(0, 240, 255, 0.1);
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.2) inset;
      }

      .serial-input {
        display: flex;
        gap: 0.5rem;
      }

      input[type="text"] {
        flex: 1;
        padding: 0.8rem;
        background: #02050a;
        border: 1px solid #334155;
        color: var(--accent);
        font-family: monospace;
        border-radius: 4px;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
      }

      #btn-send {
        background-color: var(--accent);
        color: #000;
        font-weight: bold;
      }

      .log {
        font-family: monospace;
        font-size: 0.75rem;
        color: #10b981;
        background: #02050a;
        padding: 1rem;
        border-radius: 4px;
        height: 120px;
        overflow-y: auto;
        margin-top: 1rem;
        border: 1px solid #1e293b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="hardware-bezel">
        <canvas id="display" width="240" height="240"></canvas>
      </div>

      <div class="controls">
        <h2>Telemetry Control Unit</h2>
        <div class="button-grid" id="state-buttons"></div>
        <div class="serial-input">
          <input
            type="text"
            id="serial-cmd"
            placeholder="> AWAITING COMMAND..."
            autocomplete="off"
          />
          <button id="btn-send">EXEC</button>
        </div>
        <div class="log" id="serial-log">
          > CORE SYSTEM INITIALIZED...<br />> GC9A01 DISPLAY PROTOCOL
          ACTIVE...<br />
        </div>
      </div>
    </div>

    <script>
      // ==========================================
      // MOTEUR DE RENDU HAUTE FIDÉLITÉ (SIMULATION)
      // ==========================================
      const canvas = document.getElementById("display");
      const ctx = canvas.getContext("2d", { alpha: false });

      const OrbState = {
        IDLE: 0,
        LISTENING: 1,
        SPEAKING: 2,
        ERROR: 3,
        MODE_WEATHER: 4,
        MODE_HOME: 5,
        MODE_SYSTEM: 6,
        MODE_MATRIX: 7,
        MODE_SEARCH: 8,
        MODE_MEDIA: 9,
        MODE_TIMER: 10,
        MODE_PRINT: 11,
        MODE_NOTIFICATION: 12,
        MODE_SUCCESS: 13,
        // New High Fidelity Modes
        MODE_APPS: 14,
        MODE_VISION: 15,
        MODE_GHOST: 16,
        MODE_SECURITY: 17,
      };

      let g_state = OrbState.IDLE;
      let g_text = "SYS.ONLINE";
      let g_phase = 0.0;
      let lastTime = performance.now();

      // Palettes de couleurs industrielles/Sci-Fi (Valeurs RGB)
      const PALETTE = {
        CYAN: [0, 240, 255],
        BLUE: [0, 100, 255],
        DEEP_BLUE: [10, 30, 80],
        ORANGE: [255, 120, 0],
        RED: [255, 40, 60],
        WHITE: [240, 248, 255],
        GREEN: [0, 255, 120],
        PURPLE: [180, 50, 255],
        YELLOW: [255, 200, 0],
        GREY: [100, 110, 120],
        DARK_GREY: [40, 45, 50],
      };

      // --- UTILS GRAPHIQUES ---
      function rgb(c, alpha = 1) {
        return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha})`;
      }

      function setGlow(color, blur) {
        ctx.shadowColor = color ? rgb(color) : "transparent";
        ctx.shadowBlur = blur || 0;
      }

      // --- RENDERERS DE HAUTE PRÉCISION ---

      // HUD Persistant (Cadre et réticules micrométriques)
      function drawPersistentHUD() {
        let cx = 120,
          cy = 120;
        ctx.lineWidth = 1;

        // Anneau extérieur fin
        ctx.strokeStyle = rgb(PALETTE.DEEP_BLUE, 0.8);
        ctx.beginPath();
        ctx.arc(cx, cy, 118, 0, Math.PI * 2);
        ctx.stroke();

        // Graduations de précision (Degrés)
        for (let i = 0; i < 72; i++) {
          let angle = i * 5 * (Math.PI / 180);
          let isMajor = i % 18 === 0; // Tous les 90 deg
          let isMedium = i % 6 === 0; // Tous les 30 deg

          let innerR = isMajor ? 105 : isMedium ? 110 : 114;
          let outerR = 118;

          ctx.strokeStyle = isMajor
            ? rgb(PALETTE.CYAN, 0.8)
            : rgb(PALETTE.GREY, 0.3);
          ctx.beginPath();
          ctx.moveTo(
            cx + Math.cos(angle) * innerR,
            cy + Math.sin(angle) * innerR,
          );
          ctx.lineTo(
            cx + Math.cos(angle) * outerR,
            cy + Math.sin(angle) * outerR,
          );
          ctx.stroke();

          // Texte des axes majeurs
          if (isMajor) {
            ctx.fillStyle = rgb(PALETTE.CYAN, 0.6);
            ctx.font = "8px monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            let textR = 98;
            ctx.fillText(
              `${i * 5}°`,
              cx + Math.cos(angle) * textR,
              cy + Math.sin(angle) * textR,
            );
          }
        }

        // Crosshair central discret
        ctx.strokeStyle = rgb(PALETTE.GREY, 0.2);
        ctx.beginPath();
        ctx.moveTo(cx - 5, cy);
        ctx.lineTo(cx + 5, cy);
        ctx.moveTo(cx, cy - 5);
        ctx.lineTo(cx, cy + 5);
        ctx.stroke();

        // Indicateur de statut (Batterie / Link) en haut
        let blink = Math.sin(g_phase * 5) > 0;
        ctx.fillStyle = blink
          ? rgb(PALETTE.GREEN, 0.8)
          : rgb(PALETTE.GREEN, 0.2);
        ctx.fillRect(110, 6, 4, 2);
        ctx.fillRect(115, 6, 4, 2);
        ctx.fillRect(120, 6, 4, 2);
        ctx.fillStyle = rgb(PALETTE.GREY, 0.3);
        ctx.fillRect(125, 6, 4, 2); // Un trait vide
      }

      // Onde polaire déformable (Rendu organique "Siri/Jarvis")
      function drawOrganicOrb(
        cx,
        cy,
        baseRadius,
        intensity,
        color,
        phaseOffset,
      ) {
        ctx.beginPath();
        let points = 60;
        for (let i = 0; i <= points; i++) {
          let angle = (i / points) * Math.PI * 2;
          // Formule de déformation complexe combinant plusieurs fréquences
          let noise =
            Math.sin(angle * 3 + g_phase * 2 + phaseOffset) *
            Math.cos(angle * 5 - g_phase) *
            Math.sin(g_phase * 0.5);
          let r = baseRadius + noise * intensity;

          let x = cx + Math.cos(angle) * r;
          let y = cy + Math.sin(angle) * r;

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();

        // Gradient radial pour le volume
        let grad = ctx.createRadialGradient(
          cx,
          cy,
          baseRadius * 0.2,
          cx,
          cy,
          baseRadius + intensity,
        );
        grad.addColorStop(0, rgb(color, 0.8));
        grad.addColorStop(0.5, rgb(color, 0.3));
        grad.addColorStop(1, rgb(color, 0));

        ctx.fillStyle = grad;
        ctx.fill();

        // Ligne de bordure lumineuse
        ctx.strokeStyle = rgb(color, 0.6);
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // ==========================================
      // BOUCLE PRINCIPALE (MOTEUR D'ÉTAT)
      // ==========================================
      function updateAndDraw(timestamp) {
        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        g_phase += dt;

        // Reset du fond pour netteté absolue (pas de traînée floue)
        ctx.fillStyle = "#02050a";
        ctx.fillRect(0, 0, 240, 240);

        // 1. Dessin du HUD technique de base (toujours présent)
        drawPersistentHUD();

        let cx = 120,
          cy = 120;
        ctx.globalCompositeOperation = "screen"; // Mode additif pour les lumières
        // Note: pour certains rendus style 'print' on repassera en 'source-over' si besoin

        // --- LOGIQUE DES MODES ---

        if (
          g_state === OrbState.IDLE ||
          g_state === OrbState.LISTENING ||
          g_state === OrbState.SPEAKING
        ) {
          // CORE ORB (Haute fidélité)
          let baseColor =
            g_state === OrbState.IDLE
              ? PALETTE.CYAN
              : g_state === OrbState.LISTENING
                ? PALETTE.GREEN
                : PALETTE.ORANGE;

          let amplitude =
            g_state === OrbState.SPEAKING
              ? 25
              : g_state === OrbState.IDLE
                ? 5
                : 15;
          let baseRadius = g_state === OrbState.SPEAKING ? 40 : 30;

          setGlow(baseColor, 15);
          // Dessin de 3 couches organiques superposées avec déphasage
          drawOrganicOrb(cx, cy, baseRadius, amplitude, baseColor, 0);
          drawOrganicOrb(
            cx,
            cy,
            baseRadius * 0.8,
            amplitude * 1.2,
            PALETTE.WHITE,
            2,
          );
          drawOrganicOrb(
            cx,
            cy,
            baseRadius * 1.1,
            amplitude * 0.5,
            baseColor,
            4,
          );
          setGlow(null, 0);

          // Analyseur de spectre circulaire périphérique (simulé)
          ctx.strokeStyle = rgb(baseColor, 0.4);
          ctx.lineWidth = 2;
          for (let i = 0; i < 36; i++) {
            let angle = i * 10 * (Math.PI / 180);
            let val =
              Math.abs(Math.sin(g_phase * 5 + i)) *
              (g_state === OrbState.SPEAKING ? 15 : 3);
            let r1 = 60,
              r2 = 60 + val;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(angle) * r1, cy + Math.sin(angle) * r1);
            ctx.lineTo(cx + Math.cos(angle) * r2, cy + Math.sin(angle) * r2);
            ctx.stroke();
          }
        } else if (g_state === OrbState.MODE_SYSTEM) {
          // HARDWARE DIAGNOSTIC (Arc Reactor Style)
          ctx.lineWidth = 2;

          // Anneau 1 : Vitesse rapide, haché
          ctx.setLineDash([10, 15]);
          ctx.strokeStyle = rgb(PALETTE.CYAN, 0.8);
          ctx.beginPath();
          ctx.arc(cx, cy, 75, g_phase * 2, Math.PI * 2 + g_phase * 2);
          ctx.stroke();

          // Anneau 2 : Contre-rotatif, blocs
          ctx.setLineDash([40, 5, 5, 5]);
          ctx.strokeStyle = rgb(PALETTE.WHITE, 0.6);
          ctx.beginPath();
          ctx.arc(cx, cy, 65, -g_phase, Math.PI * 2 - g_phase);
          ctx.stroke();
          ctx.setLineDash([]); // reset

          // Hexagone central rotatif
          ctx.strokeStyle = rgb(PALETTE.CYAN, 0.5);
          ctx.beginPath();
          for (let i = 0; i <= 6; i++) {
            let a = i * (Math.PI / 3) + g_phase * 0.5;
            let x = cx + Math.cos(a) * 40;
            let y = cy + Math.sin(a) * 40;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();

          // Micro-données techniques
          ctx.fillStyle = rgb(PALETTE.WHITE, 0.9);
          ctx.font = "10px monospace";
          ctx.textAlign = "right";
          ctx.fillText(
            `CPU: ${(40 + Math.sin(g_phase * 10) * 20).toFixed(1)}%`,
            cx - 5,
            cy - 10,
          );
          ctx.fillText(`RAM: 1.2GB`, cx - 5, cy + 5);
          ctx.fillText(`NET: OK`, cx - 5, cy + 20);
        } else if (g_state === OrbState.MODE_PRINT) {
          // 3D PRINTER TELEMETRY (Klipper HUD)
          // 1. Grille isométrique du plateau (Bed)
          ctx.strokeStyle = rgb(PALETTE.BLUE, 0.5);
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let i = -3; i <= 3; i++) {
            ctx.moveTo(cx - 40 + i * 10, cy + 20 + i * 5);
            ctx.lineTo(cx + 20 + i * 10, cy - 10 + i * 5);
          }
          /*
                for(let i=-3; i<=3; i++) { // Lignes Y (Simplifié pour lisibilité)
                    ctx.moveTo(cx - 40 + i*10, cy + 20 - i*5);
                    ctx.lineTo(cx + 20 + i*10, cy + 50 - i*5);
                }
                */
          ctx.stroke();

          // Rendu du Mesh en cours (Cube filaire montant)
          let zHeight = (g_phase * 5) % 30; // Progression Z
          ctx.strokeStyle = rgb(PALETTE.CYAN, 0.9);
          ctx.fillStyle = rgb(PALETTE.CYAN, 0.1);
          ctx.beginPath();
          ctx.moveTo(cx - 10, cy + 35 - zHeight);
          ctx.lineTo(cx + 20, cy + 20 - zHeight);
          ctx.lineTo(cx, cy + 10 - zHeight);
          ctx.lineTo(cx - 30, cy + 25 - zHeight);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Buse (Nozzle) positionnée
          ctx.fillStyle = rgb(PALETTE.WHITE);
          ctx.beginPath();
          ctx.arc(cx - 10, cy + 35 - zHeight, 2, 0, Math.PI * 2);
          ctx.fill();
          // Extrusion
          ctx.strokeStyle = rgb(PALETTE.ORANGE, 1.0);
          setGlow(PALETTE.ORANGE, 5);
          ctx.beginPath();
          ctx.moveTo(cx - 10, cy + 35 - zHeight);
          ctx.lineTo(cx - 10, cy + 38 - zHeight);
          ctx.stroke();
          setGlow(null, 0);

          // 2. Graphique de température en temps réel
          ctx.strokeStyle = rgb(PALETTE.RED, 0.8);
          ctx.beginPath();
          for (let x = 0; x < 80; x++) {
            let y = cy + 70 - (20 + Math.sin(x * 0.2 + g_phase * 4) * 3);
            if (x === 0) ctx.moveTo(cx - 40 + x, y);
            else ctx.lineTo(cx - 40 + x, y);
          }
          ctx.stroke();

          ctx.fillStyle = rgb(PALETTE.WHITE);
          ctx.font = "10px monospace";
          ctx.textAlign = "left";
          ctx.fillText(`HOT: 215°C`, cx - 35, cy - 30);
          ctx.fillStyle = rgb(PALETTE.BLUE);
          ctx.fillText(`BED: 60°C`, cx - 35, cy - 18);
        } else if (g_state === OrbState.MODE_HOME) {
          // DOMOTICS MAP (Radar spatial)
          ctx.strokeStyle = rgb(PALETTE.BLUE, 0.3);
          ctx.beginPath();
          ctx.arc(cx, cy, 30, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx, cy, 60, 0, Math.PI * 2);
          ctx.stroke();

          // Ligne de balayage radar
          let scanAngle = g_phase * 2;
          let grad = ctx.createLinearGradient(
            cx,
            cy,
            cx + Math.cos(scanAngle) * 80,
            cy + Math.sin(scanAngle) * 80,
          );
          grad.addColorStop(0, rgb(PALETTE.CYAN, 0.8));
          grad.addColorStop(1, rgb(PALETTE.CYAN, 0));

          ctx.strokeStyle = grad;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(
            cx + Math.cos(scanAngle) * 80,
            cy + Math.sin(scanAngle) * 80,
          );
          ctx.stroke();

          // Nœuds domotiques
          let nodes = [
            { a: 0.5, d: 40, label: "LIV" },
            { a: 2.1, d: 65, label: "KIT" },
            { a: 4.8, d: 50, label: "BED" },
          ];
          ctx.font = "8px monospace";
          nodes.forEach((n) => {
            let nx = cx + Math.cos(n.a) * n.d;
            let ny = cy + Math.sin(n.a) * n.d;
            let angleDiff = Math.abs((scanAngle % (Math.PI * 2)) - n.a);
            let intensity = angleDiff < 0.3 ? 1.0 : 0.3;
            ctx.fillStyle = rgb(PALETTE.CYAN, intensity);
            ctx.beginPath();
            ctx.arc(nx, ny, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = rgb(PALETTE.WHITE, intensity + 0.2);
            ctx.fillText(n.label, nx + 6, ny + 3);
          });
        } else if (g_state === OrbState.MODE_WEATHER) {
          // ADVANCED METEOROLOGICAL DASHBOARD
          let tempProgress = 0.7; // 24°C
          ctx.lineWidth = 4;
          ctx.strokeStyle = rgb(PALETTE.GREY, 0.3);
          ctx.beginPath();
          ctx.arc(cx, cy, 75, Math.PI * 0.8, Math.PI * 2.2);
          ctx.stroke();

          ctx.strokeStyle = rgb(PALETTE.ORANGE, 0.9);
          ctx.beginPath();
          ctx.arc(
            cx,
            cy,
            75,
            Math.PI * 0.8,
            Math.PI * 0.8 + Math.PI * 1.4 * tempProgress,
          );
          ctx.stroke();

          // Icône Soleil
          ctx.fillStyle = rgb(PALETTE.YELLOW);
          ctx.beginPath();
          ctx.arc(cx - 20, cy - 15, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = rgb(PALETTE.YELLOW);
          ctx.lineWidth = 2;
          for (let i = 0; i < 8; i++) {
            let a = i * (Math.PI / 4) + g_phase;
            ctx.beginPath();
            ctx.moveTo(cx - 20 + Math.cos(a) * 16, cy - 15 + Math.sin(a) * 16);
            ctx.lineTo(cx - 20 + Math.cos(a) * 22, cy - 15 + Math.sin(a) * 22);
            ctx.stroke();
          }

          ctx.fillStyle = rgb(PALETTE.WHITE);
          ctx.textAlign = "left";
          ctx.font = "bold 28px sans-serif";
          ctx.fillText("24°", cx + 5, cy - 10);
          ctx.font = "10px monospace";
          ctx.fillStyle = rgb(PALETTE.CYAN);
          ctx.fillText("HUM: 45%", cx - 25, cy + 20);
          ctx.fillText("WND: 12km/h", cx - 25, cy + 32);
        } else if (g_state === OrbState.MODE_MATRIX) {
          // DATA TUNNEL
          ctx.textAlign = "center";
          for (let i = 0; i < 15; i++) {
            let z = (g_phase * 80 + i * 20) % 120;
            let scale = z / 120;
            let alpha = z / 120;
            ctx.font = `${10 + scale * 15}px monospace`;
            ctx.fillStyle = rgb(PALETTE.GREEN, alpha);
            let r = 20 + scale * 80;
            let char = String.fromCharCode(0x30a0 + (i % 32));
            let angle = i * 2;
            ctx.fillText(
              char,
              cx + Math.cos(angle) * r,
              cy + Math.sin(angle) * r,
            );
            ctx.fillText(
              char,
              cx + Math.cos(angle + Math.PI) * r,
              cy + Math.sin(angle + Math.PI) * r,
            );
          }
        } else if (g_state === OrbState.MODE_SEARCH) {
          // RADAR PULSE
          setGlow(PALETTE.CYAN, 20);
          ctx.strokeStyle = rgb(PALETTE.CYAN);
          let r = (g_phase * 50) % 80;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx, cy, r * 0.6, 0, Math.PI * 2);
          ctx.stroke();
          setGlow(null, 0);
          // Center Eye
          ctx.fillStyle = rgb(PALETTE.WHITE);
          ctx.beginPath();
          ctx.arc(cx, cy, 4, 0, Math.PI * 2);
          ctx.fill();
        } else if (g_state === OrbState.MODE_MEDIA) {
          // FLUID DANCE
          setGlow(PALETTE.PURPLE, 30);
          ctx.fillStyle = rgb(PALETTE.PURPLE, 0.6);
          ctx.beginPath();
          for (let i = 0; i <= Math.PI * 2; i += 0.1) {
            let r =
              50 +
              Math.sin(i * 3 + g_phase * 3) * 15 +
              Math.cos(i * 5 - g_phase) * 10;
            let x = cx + Math.cos(i) * r,
              y = cy + Math.sin(i) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.fill();
          setGlow(null, 0);
        } else if (g_state === OrbState.MODE_TIMER) {
          // COUNTDOWN RING
          let progress = Math.abs(Math.sin(g_phase * 0.5));
          ctx.lineWidth = 6;
          setGlow(PALETTE.ORANGE, 15);
          ctx.strokeStyle = rgb(PALETTE.ORANGE);
          ctx.beginPath();
          ctx.arc(
            cx,
            cy,
            80,
            -Math.PI / 2,
            Math.PI * 2 * progress - Math.PI / 2,
          );
          ctx.stroke();
          setGlow(null, 0);

          ctx.fillStyle = rgb(PALETTE.WHITE);
          ctx.font = "bold 24px monospace";
          ctx.fillText(((1.0 - progress) * 60).toFixed(0), cx, cy + 8);
        } else if (g_state === OrbState.MODE_NOTIFICATION) {
          // HEX ALERT
          setGlow(PALETTE.YELLOW, 20);
          ctx.strokeStyle = rgb(PALETTE.YELLOW);
          ctx.lineWidth = 3;
          let pulse = 1.0 + Math.sin(g_phase * 10) * 0.1;
          ctx.beginPath();
          for (let i = 0; i <= 6; i++) {
            let a = i * (Math.PI / 3);
            let x = cx + Math.cos(a) * 50 * pulse,
              y = cy + Math.sin(a) * 50 * pulse;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
          ctx.fillStyle = rgb(PALETTE.WHITE);
          ctx.font = "bold 40px sans-serif";
          ctx.fillText("!", cx, cy + 12);
        } else if (g_state === OrbState.ERROR) {
          // GLITCH RED
          let shift = (Math.random() - 0.5) * 5;
          setGlow(PALETTE.RED, 20);
          ctx.fillStyle = rgb(PALETTE.RED);
          ctx.fillText("ERROR", cx + shift, cy);
          ctx.strokeStyle = rgb(PALETTE.RED, 0.5);
          ctx.beginPath();
          ctx.moveTo(0, cy + shift);
          ctx.lineTo(240, cy + shift);
          ctx.stroke();
        } else if (g_state === OrbState.MODE_SUCCESS) {
          // CHECK GREEN
          setGlow(PALETTE.GREEN, 20);
          ctx.strokeStyle = rgb(PALETTE.GREEN);
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(cx, cy, 60, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx - 20, cy);
          ctx.lineTo(cx - 5, cy + 15);
          ctx.lineTo(cx + 25, cy - 20);
          ctx.stroke();
        } else if (g_state === OrbState.MODE_APPS) {
          // APP LAUNCHER (Grid Carousel)
          setGlow(PALETTE.PURPLE, 15);
          ctx.fillStyle = rgb(PALETTE.PURPLE, 0.4);
          ctx.strokeStyle = rgb(PALETTE.PURPLE, 0.8);
          let size = 15;
          let spacing = 25;
          let rot = g_phase * 0.5;

          // Rotation 3D simulée
          for (let i = 0; i < 8; i++) {
            let angle = (i / 8) * Math.PI * 2 + rot;
            let r = 70;
            let x = cx + Math.cos(angle) * r;
            let y = cy + Math.sin(angle) * r * 0.6; // Perspective

            let scale = 0.5 + (Math.sin(angle) + 1) * 0.5; // Scale by depth
            let s = size * scale;

            ctx.globalAlpha = scale;
            ctx.beginPath();
            ctx.rect(x - s / 2, y - s / 2, s, s);
            ctx.fill();
            ctx.stroke();
            ctx.globalAlpha = 1.0;
          }

          // Central Icon
          ctx.strokeStyle = rgb(PALETTE.WHITE);
          ctx.lineWidth = 2;
          ctx.strokeRect(cx - 15, cy - 15, 30, 30);
          setGlow(null, 0);
        } else if (g_state === OrbState.MODE_VISION) {
          // RETINAL SCAN TERMINTAOR
          setGlow(PALETTE.RED, 20);
          ctx.strokeStyle = rgb(PALETTE.RED);
          ctx.lineWidth = 2;

          // Dynamic Crosshair
          let r = 80;
          ctx.beginPath();
          ctx.moveTo(cx - r, cy);
          ctx.lineTo(cx - r + 20, cy);
          ctx.moveTo(cx + r, cy);
          ctx.lineTo(cx + r - 20, cy);
          ctx.moveTo(cx, cy - r);
          ctx.lineTo(cx, cy - r + 20);
          ctx.moveTo(cx, cy + r);
          ctx.lineTo(cx, cy + r - 20);
          ctx.stroke();

          // Scanning Bar
          let scanY = cy + Math.sin(g_phase * 5) * 80;
          ctx.lineWidth = 4;
          ctx.strokeStyle = rgb(PALETTE.RED, 0.8);
          ctx.beginPath();
          ctx.moveTo(cx - 60, scanY);
          ctx.lineTo(cx + 60, scanY);
          ctx.stroke();

          // Data Stream
          ctx.fillStyle = rgb(PALETTE.RED);
          ctx.font = "8px monospace";
          ctx.textAlign = "right";
          ctx.fillText(
            `OBJ: ${Math.floor(g_phase * 100) % 999}`,
            cx + 70,
            cy - 40,
          );
          ctx.fillText(
            `CONF: ${(80 + Math.random() * 20).toFixed(1)}%`,
            cx + 70,
            cy - 30,
          );
        } else if (g_state === OrbState.MODE_GHOST) {
          // PASSIVE STEALTH
          // Dark, minimal pulsing ring
          ctx.strokeStyle = rgb(PALETTE.DARK_GREY);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(cx, cy, 40 + Math.sin(g_phase) * 5, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = rgb(PALETTE.GREY, 0.5);
          ctx.beginPath();
          ctx.arc(cx, cy, 90, 0, Math.PI * 2);
          ctx.stroke();

          // Subtles waveforms
          ctx.strokeStyle = rgb(PALETTE.DEEP_BLUE, 0.4);
          ctx.beginPath();
          for (let x = -40; x <= 40; x += 5) {
            let y = cy + Math.sin(x * 0.1 + g_phase) * 10;
            if (x === -40) ctx.moveTo(cx + x, y);
            else ctx.lineTo(cx + x, y);
          }
          ctx.stroke();
        } else if (g_state === OrbState.MODE_SECURITY) {
          // SHIELD / LOCK
          setGlow(PALETTE.BLUE, 20);
          ctx.strokeStyle = rgb(PALETTE.BLUE);
          ctx.fillStyle = rgb(PALETTE.BLUE, 0.2);
          ctx.lineWidth = 3;

          // Shield Shape
          ctx.beginPath();
          ctx.moveTo(cx, cy - 50);
          ctx.quadraticCurveTo(cx + 40, cy - 50, cx + 40, cy - 10);
          ctx.quadraticCurveTo(cx + 40, cy + 40, cx, cy + 60);
          ctx.quadraticCurveTo(cx - 40, cy + 40, cx - 40, cy - 10);
          ctx.quadraticCurveTo(cx - 40, cy - 50, cx, cy - 50);
          ctx.fill();
          ctx.stroke();

          // Padlock Icon
          ctx.fillStyle = rgb(PALETTE.WHITE);
          ctx.fillRect(cx - 10, cy - 5, 20, 15);
          ctx.strokeStyle = rgb(PALETTE.WHITE);
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(cx, cy - 5, 7, Math.PI, 0);
          ctx.stroke();
        }

        // --- TEXTE GLOBAL D'ÉTAT (Texte central bas) ---
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = rgb(PALETTE.WHITE, 0.9);
        ctx.font = "bold 11px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        let tw = ctx.measureText(g_text).width;
        ctx.fillStyle = rgb([0, 0, 0], 0.7);
        ctx.fillRect(cx - tw / 2 - 4, 195, tw + 8, 14);
        ctx.fillStyle = rgb(PALETTE.CYAN);
        ctx.fillText(`[ ${g_text} ]`, cx, 202);

        requestAnimationFrame(updateAndDraw);
      }

      // ==========================================
      // CONTRÔLES UI
      // ==========================================
      const btnContainer = document.getElementById("state-buttons");
      const logBox = document.getElementById("serial-log");

      function logEvent(msg) {
        logBox.innerHTML += `> ${msg}<br>`;
        logBox.scrollTop = logBox.scrollHeight;
      }

      Object.keys(OrbState).forEach((key) => {
        let btn = document.createElement("button");
        btn.innerText = key.replace("MODE_", "");
        btn.onclick = () => {
          document
            .querySelectorAll("button")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          g_state = OrbState[key];
          logEvent(`STATE CHANGED -> ${key}`);
        };
        btnContainer.appendChild(btn);
      });

      document.getElementById("btn-send").onclick = () => {
        const input = document.getElementById("serial-cmd");
        if (input.value) {
          logEvent(`CMD RECV: ${input.value}`);
          g_text = input.value.substring(0, 15).toUpperCase();
          input.value = "";
        }
      };

      // Lancement
      requestAnimationFrame(updateAndDraw);
    </script>
  </body>
</html>
