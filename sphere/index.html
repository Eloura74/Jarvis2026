<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS OS - Simulateur Physique V7.2</title>
    <style>
      :root {
        --bg-color: #050a10;
        --panel-bg: #0a111c;
        --primary: #00f0ff;
        --text-main: #e0f8ff;
        --font-stack: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-stack);
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 40px;
        height: 100vh;
        box-sizing: border-box;
      }

      /* --- HARDWARE SIMULATION --- */
      .hardware-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .bezel {
        width: 280px;
        height: 280px;
        background: radial-gradient(circle, #2a2a2a 0%, #111 70%, #000 100%);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow:
          0 15px 35px rgba(0, 0, 0, 0.8),
          inset 0 2px 5px rgba(255, 255, 255, 0.1);
      }

      .screen {
        width: 240px;
        height: 240px;
        background-color: #020305;
        border-radius: 50%;
        overflow: hidden; /* Masque matériel GC9A01 */
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
        position: relative;
      }

      canvas {
        display: block;
      }

      /* --- CONTROL PANEL --- */
      .control-panel {
        background-color: var(--panel-bg);
        border: 1px solid #1a2b45;
        border-radius: 8px;
        padding: 20px;
        width: 400px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        max-height: 90vh;
        overflow-y: auto;
      }

      h2 {
        margin-top: 0;
        font-size: 1rem;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid #1a2b45;
        padding-bottom: 8px;
      }

      .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 25px;
      }

      button {
        background: transparent;
        color: var(--primary);
        border: 1px solid var(--primary);
        padding: 8px;
        cursor: pointer;
        font-family: var(--font-stack);
        font-size: 0.75rem;
        font-weight: bold;
        text-transform: uppercase;
        border-radius: 4px;
        transition: all 0.2s ease;
      }

      button:hover {
        background: rgba(0, 240, 255, 0.1);
      }
      button.active {
        background: var(--primary);
        color: var(--bg-color);
      }

      .btn-danger {
        color: #ff283c;
        border-color: #ff283c;
      }
      .btn-danger:hover {
        background: rgba(255, 40, 60, 0.1);
      }
      .btn-success {
        color: #00ff78;
        border-color: #00ff78;
      }
      .btn-success:hover {
        background: rgba(0, 255, 120, 0.1);
      }

      input[type="text"] {
        width: calc(100% - 22px);
        background: #0d1826;
        border: 1px solid #0064ff;
        color: white;
        padding: 10px;
        font-family: monospace;
        border-radius: 4px;
        outline: none;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="hardware-wrapper">
      <div class="bezel">
        <div class="screen">
          <canvas id="display" width="240" height="240"></canvas>
        </div>
      </div>
      <div style="color: #666; font-family: monospace">
        Simulation GC9A01 - V7.2
      </div>
    </div>

    <div class="control-panel">
      <h2>Données Locales (local_text)</h2>
      <input
        type="text"
        id="textInput"
        placeholder="Ex: 220|60|45 ou STANDBY"
        value="STANDBY"
      />
      <button style="width: 100%; margin-bottom: 20px" onclick="updateText()">
        Mettre à jour le texte
      </button>

      <h2>Noyau & Modes Généraux</h2>
      <div class="btn-grid" id="core-btns">
        <button onclick="setMode('IDLE')" class="active">IDLE (Standby)</button>
        <button onclick="setMode('LISTENING')">Listening</button>
        <button onclick="setMode('SPEAKING')">Speaking</button>
        <button onclick="setMode('SCREENSAVER')">Screensaver</button>
        <button onclick="setMode('SEARCH')">Search</button>
        <button onclick="setMode('GHOST')">Ghost</button>
        <button class="btn-danger" onclick="setMode('ERROR')">Error</button>
        <button class="btn-success" onclick="setMode('SUCCESS')">
          Success
        </button>
      </div>

      <h2>Applications & Domotique</h2>
      <div class="btn-grid" id="app-btns">
        <button onclick="setMode('SYSTEM')">System</button>
        <button onclick="setMode('HOME')">Home</button>
        <button onclick="setMode('VISION')">Vision AI</button>
        <button onclick="setMode('MATRIX')">Matrix</button>
        <button onclick="setMode('MEDIA')">Media</button>
        <button onclick="setMode('TIMER')">Timer</button>
        <button onclick="setMode('WEATHER')">Weather</button>
        <button onclick="setMode('PRINT')">3D Print</button>
        <button onclick="setMode('APPS')">Apps (Lock)</button>
        <button class="btn-success" onclick="setMode('WHATSAPP')">
          WhatsApp
        </button>
        <button class="btn-danger" onclick="setMode('SECURITY')">
          Security
        </button>
      </div>
    </div>

    <script>
      // ==============================================================================
      // MOTEUR DE RENDU JS (PORTAGE EXACT DU CODE C++ ESP32 V7.2)
      // ==============================================================================
      const canvas = document.getElementById("display");
      const ctx = canvas.getContext("2d", { alpha: false });

      const CX = 120;
      const CY = 120;
      const DEG_TO_RAD = 0.0174532925;

      let local_state = "IDLE";
      let local_text = "STANDBY";
      let g_phase = 0.0;
      let ms_time = 0;

      const COLORS = {
        BG: { r: 2, g: 3, b: 5 },
        CYAN: { r: 0, g: 240, b: 255 },
        BLUE: { r: 0, g: 100, b: 255 },
        OMNI_BLUE: { r: 0, g: 140, b: 255 },
        OMNI_RED: { r: 255, g: 10, b: 30 },
        WHITE: { r: 240, g: 248, b: 255 },
        GREEN: { r: 0, g: 255, b: 120 },
        YELLOW: { r: 255, g: 200, b: 0 },
        ORANGE: { r: 255, g: 120, b: 0 },
        PURPLE: { r: 180, g: 50, b: 255 },
        PINK: { r: 255, g: 0, b: 127 },
        RED: { r: 255, g: 40, b: 60 },
        DEEP_BLUE: { r: 5, g: 15, b: 30 },
        GREY: { r: 100, g: 110, b: 120 },
        DARK: { r: 10, g: 15, b: 20 },
      };

      let dyn_radius = 65.0;
      let v_radius = 0.0;
      let dyn_speed = 0.05;
      let v_speed = 0.0;
      let dyn_color = COLORS.OMNI_BLUE;

      const SPHERE_NODES = 450;
      const sphereBase = [];

      function init3DGeometry() {
        const phi = Math.PI * (3.0 - Math.sqrt(5.0));
        for (let i = 0; i < SPHERE_NODES; i++) {
          let y = 1.0 - (i / (SPHERE_NODES - 1)) * 2.0;
          let radius = Math.sqrt(1.0 - y * y);
          let theta = phi * i;
          sphereBase.push({
            x: Math.cos(theta) * radius,
            y: y,
            z: Math.sin(theta) * radius,
          });
        }
      }
      init3DGeometry();

      // Outils Mathématiques & Dessin
      function lerpColor(c1, c2, t) {
        t = Math.max(0, Math.min(1, t));
        return {
          r: Math.round(c1.r + (c2.r - c1.r) * t),
          g: Math.round(c1.g + (c2.g - c1.g) * t),
          b: Math.round(c1.b + (c2.b - c1.b) * t),
        };
      }
      function toCss(c) {
        return `rgb(${c.r}, ${c.g}, ${c.b})`;
      }

      function drawCircle(x, y, r, color, fill = false) {
        if (r <= 0) return;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        if (fill) {
          ctx.fillStyle = toCss(color);
          ctx.fill();
        } else {
          ctx.strokeStyle = toCss(color);
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      function drawLine(x1, y1, x2, y2, color, width = 1) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = toCss(color);
        ctx.lineWidth = width;
        ctx.stroke();
      }

      function fillRect(x, y, w, h, color) {
        ctx.fillStyle = toCss(color);
        ctx.fillRect(x, y, w, h);
      }

      function drawRect(x, y, w, h, color) {
        ctx.strokeStyle = toCss(color);
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, w, h);
      }

      function fillTriangle(x1, y1, x2, y2, x3, y3, color) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x3, y3);
        ctx.fillStyle = toCss(color);
        ctx.fill();
      }

      // Correction de l'erreur IndexSizeError avec Math.max(0)
      function drawGlow(x, y, radius, color, intensity) {
        radius = Math.max(0, radius);
        intensity = Math.max(0, intensity);
        if (radius + intensity <= 0) return;
        const grad = ctx.createRadialGradient(
          x,
          y,
          radius,
          x,
          y,
          radius + intensity,
        );
        grad.addColorStop(0, toCss(color));
        grad.addColorStop(1, toCss(COLORS.BG));
        ctx.beginPath();
        ctx.arc(x, y, radius + intensity, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
      }

      // Simulation exacte de fillArc de LovyanGFX
      function drawSegmentedRing(
        x,
        y,
        r,
        thickness,
        segments,
        phase,
        gapRatio,
        color,
      ) {
        let angleStep = 360.0 / segments;
        let gap = angleStep * gapRatio;
        ctx.strokeStyle = toCss(color);
        ctx.lineWidth = thickness;
        for (let i = 0; i < segments; i++) {
          let startAngle = (i * angleStep + phase) * DEG_TO_RAD;
          let endAngle = (i * angleStep + phase + angleStep - gap) * DEG_TO_RAD;
          ctx.beginPath();
          ctx.arc(x, y, Math.max(0, r - thickness / 2), startAngle, endAngle);
          ctx.stroke();
        }
      }
      function fillArc(x, y, r, r_inner, startDeg, endDeg, color) {
        ctx.beginPath();
        let thickness = r - r_inner;
        ctx.arc(
          x,
          y,
          Math.max(0, r - thickness / 2),
          startDeg * DEG_TO_RAD,
          endDeg * DEG_TO_RAD,
        );
        ctx.lineWidth = thickness;
        ctx.strokeStyle = toCss(color);
        ctx.stroke();
      }

      function drawText(text, x, y, color, size = "12px", align = "center") {
        ctx.font = `${size} sans-serif`;
        ctx.fillStyle = toCss(color);
        ctx.textAlign = align;
        ctx.fillText(text, x, y);
      }

      // ==============================================================================
      // LOGIQUE D'ANIMATION ET VUES
      // ==============================================================================

      function updateLogic() {
        let tr = 65.0,
          ts = 0.03,
          tc = COLORS.OMNI_BLUE;

        if (local_state === "SPEAKING") {
          tr = 75.0 + Math.sin(g_phase * 1.5) * 12.0;
          ts = 0.08;
          tc = COLORS.OMNI_RED;
        } else if (local_state === "LISTENING") {
          tr = 70.0 + Math.sin(g_phase * 0.8) * 6.0;
          ts = 0.04;
          tc = COLORS.CYAN;
        } else if (local_state === "IDLE") {
          tr = 65.0 + Math.sin(g_phase * 0.5) * 3.0;
          ts = 0.02;
          tc = COLORS.OMNI_BLUE;
        } else {
          switch (local_state) {
            case "ERROR":
              tr = 20.0;
              ts = 0.0;
              tc = COLORS.RED;
              break;
            case "HOME":
              tr = 0.0;
              ts = 0.08;
              tc = COLORS.BLUE;
              break;
            case "VISION":
              tr = 0.0;
              ts = 0.1;
              tc = COLORS.RED;
              break;
            case "GHOST":
              tr = 10.0;
              ts = 0.01;
              tc = COLORS.GREY;
              break;
            case "MEDIA":
              tr = 20.0;
              ts = 0.1;
              tc = COLORS.PINK;
              break;
            case "SUCCESS":
              tr = 0.0;
              ts = 0.05;
              tc = COLORS.GREEN;
              break;
            case "SCREENSAVER":
              tr = 0.0;
              ts = 0.015;
              tc = COLORS.CYAN;
              break;
            case "WHATSAPP":
              tr = 10.0;
              ts = 0.06;
              tc = COLORS.GREEN;
              break;
            default:
              tr = 30.0;
              ts = 0.05;
              tc = COLORS.CYAN;
              break;
          }
        }

        const tension = 0.08,
          dampening = 0.75;
        v_radius = (v_radius + (tr - dyn_radius) * tension) * dampening;
        dyn_radius += v_radius;
        v_speed = (v_speed + (ts - dyn_speed) * tension) * dampening;
        dyn_speed += v_speed;
        dyn_color = lerpColor(dyn_color, tc, 0.15);
        g_phase += dyn_speed;
      }

      function renderOmniSphere() {
        let centerGlowCol = lerpColor(COLORS.BG, dyn_color, 0.12);
        for (let r = 120; r > 30; r -= 4) {
          let f = 1.0 - r / 120.0;
          drawCircle(
            CX,
            CY,
            r,
            lerpColor(COLORS.BG, centerGlowCol, f * f * f),
            false,
          );
        }

        for (
          let r = Math.floor(dyn_radius * 0.85) + 25;
          r > Math.floor(dyn_radius * 0.85);
          r -= 3
        ) {
          let f = 1.0 - (r - dyn_radius * 0.85) / 25.0;
          drawCircle(CX, CY, r, lerpColor(COLORS.BG, dyn_color, f * f), false);
        }

        let rotY = g_phase * 1.5,
          rotX = Math.sin(g_phase * 0.4) * 0.4;
        let cosY = Math.cos(rotY),
          sinY = Math.sin(rotY),
          cosX = Math.cos(rotX),
          sinX = Math.sin(rotX);
        let freq = local_state === "SPEAKING" ? 3.5 : 2.0;
        let waveAmp = local_state === "SPEAKING" ? 0.3 : 0.12;
        let pulsePhase = g_phase * 2.5;

        let buffer = [];
        for (let i = 0; i < SPHERE_NODES; i++) {
          let bx = sphereBase[i].x,
            by = sphereBase[i].y,
            bz = sphereBase[i].z;
          let n1 =
            Math.sin(bx * freq + pulsePhase) * Math.cos(by * freq - pulsePhase);
          let n2 = Math.sin(bz * (freq * 1.2) - pulsePhase * 1.2);
          let r = dyn_radius * (1.0 + (n1 + n2) * waveAmp);
          let x = bx * r,
            y = by * r,
            z = bz * r;

          let x_rot = x * cosY - z * sinY,
            z_rot = x * sinY + z * cosY;
          let y_rot = y * cosX - z_rot * sinX;
          z_rot = y * sinX + z_rot * cosX;

          let persp = 200.0 / (200.0 + z_rot);
          buffer.push({
            x: CX + x_rot * persp,
            y: CY + y_rot * persp,
            z: z_rot,
          });
        }

        let backCol = lerpColor(COLORS.BG, dyn_color, 0.15);
        buffer.forEach((pt) => {
          if (pt.z > 0) drawCircle(pt.x, pt.y, 1, backCol, true);
        });
        buffer.forEach((pt) => {
          if (pt.z <= 0) {
            let depth = Math.min(1.0, Math.abs(pt.z) / dyn_radius);
            let baseCol = lerpColor(dyn_color, COLORS.WHITE, depth * 0.8);
            let light = (pt.y - CY) / dyn_radius;
            if (light > 0) baseCol = lerpColor(baseCol, COLORS.BG, light * 0.6);
            else
              baseCol = lerpColor(baseCol, COLORS.WHITE, Math.abs(light) * 0.3);
            drawCircle(
              pt.x,
              pt.y,
              depth > 0.65 ? 3 : depth > 0.25 ? 2 : 1,
              baseCol,
              true,
            );
          }
        });
      }

      // ---------- TOUS LES MODES SPÉCIFIQUES V7.2 ----------
      function renderPersistentHUD() {
        fillArc(CX, CY, 119, 118, 0, 360, COLORS.DEEP_BLUE);
        fillRect(CX - 1, 0, 2, 6, COLORS.GREY);
        fillRect(CX - 1, 234, 2, 6, COLORS.GREY);
        fillRect(0, CY - 1, 6, 2, COLORS.GREY);
        fillRect(234, CY - 1, 6, 2, COLORS.GREY);
        let ledCol =
          Math.sin(g_phase * 5.0) > 0 ? COLORS.GREEN : { r: 0, g: 40, b: 0 };
        fillRect(115, 6, 4, 3, ledCol);
        fillRect(121, 6, 4, 3, ledCol);
        fillRect(127, 6, 4, 3, { r: 20, g: 20, b: 20 });
        drawText(local_text, CX, 215, dyn_color);
      }

      function renderModeScreensaver() {
        let corePulse = (Math.sin(g_phase * 2.0) + 1.0) * 0.5;
        drawGlow(CX, CY, 15 + corePulse * 5, COLORS.OMNI_BLUE, 25);
        drawCircle(CX, CY, 4 + corePulse * 2, COLORS.WHITE, true);
        drawCircle(
          CX,
          CY,
          6 + corePulse * 2,
          lerpColor(COLORS.CYAN, COLORS.BG, 0.6),
          true,
        );

        let R = 85.0,
          tiltX = 0.35,
          cosX = Math.cos(tiltX),
          sinX = Math.sin(tiltX);
        drawCircle(CX, CY, R + 10, { r: 5, g: 15, b: 25 }, false);

        const num_waves = 4,
          pts = 110;
        let buffer = [];

        for (let w = 0; w < num_waves; w++) {
          let freq = 2.0 + w * 1.5,
            speed = 0.8 + w * 0.3;
          if (w % 2 === 1) speed = -speed;
          let amp = 0.4 + w * 0.1;

          for (let i = 0; i < pts; i++) {
            let theta = (i / pts) * 2.0 * Math.PI,
              active_theta = theta + g_phase * speed;
            let phi = Math.sin(theta * freq + g_phase * (speed * 1.5)) * amp;
            let bx = R * Math.cos(phi) * Math.cos(active_theta),
              by = R * Math.sin(phi),
              bz = R * Math.cos(phi) * Math.sin(active_theta);
            let y = by * cosX - bz * sinX,
              z = by * sinX + bz * cosX;
            let persp = 200.0 / (200.0 + z);
            buffer.push({ x: CX + bx * persp, y: CY + y * persp, z: z });
          }
        }

        let backCol = lerpColor(COLORS.BG, COLORS.BLUE, 0.3);
        buffer.forEach((pt) => {
          if (pt.z > 0) fillRect(pt.x, pt.y, 1, 1, backCol);
        });

        for (let w = 0; w < num_waves; w++) {
          let off = w * pts;
          for (let i = 0; i < pts; i++) {
            let curr = buffer[off + i];
            if (curr.z <= 0) {
              let d = Math.min(1.0, Math.abs(curr.z) / R);
              let c = lerpColor(COLORS.CYAN, COLORS.WHITE, d);
              drawCircle(curr.x, curr.y, d > 0.6 ? 2 : 1, c, true);
              if (i > 0) {
                let prev = buffer[off + i - 1];
                if (prev.z <= 0) {
                  drawLine(prev.x, prev.y, curr.x, curr.y, c);
                  if (d > 0.5)
                    drawLine(prev.x, prev.y + 1, curr.x, curr.y + 1, c);
                }
              }
              if (i === pts - 1 && buffer[off].z <= 0)
                drawLine(buffer[off].x, buffer[off].y, curr.x, curr.y, c);
            }
          }
        }
      }

      function renderModeSystem() {
        drawSegmentedRing(CX, CY, 110, 8, 8, g_phase * 50.0, 0.1, COLORS.CYAN);
        drawSegmentedRing(CX, CY, 95, 2, 36, -g_phase * 80.0, 0.5, COLORS.BLUE);
        drawText("SYS.OPT", CX, CY - 15, COLORS.WHITE, "16px");
        let load = 40 + Math.sin(g_phase * 5.0) * 20;
        drawRect(CX - 40, CY, 80, 12, COLORS.CYAN);
        fillRect(CX - 38, CY + 2, (76 * load) / 100, 8, COLORS.CYAN);
        drawText("RAM: 1.2G", CX, CY + 40, COLORS.GREEN);
      }

      function renderModeVision() {
        for (let i = -120; i <= 120; i += 25) {
          drawLine(CX + i, 0, CX + i, 240, { r: 40, g: 0, b: 0 });
          drawLine(0, CY + i, 240, CY + i, { r: 40, g: 0, b: 0 });
        }
        let tr = 90 + Math.sin(g_phase * 10.0) * 5;
        drawLine(CX - tr, CY - tr / 2, CX - tr, CY - tr, COLORS.RED);
        drawLine(CX - tr, CY - tr, CX - tr / 2, CY - tr, COLORS.RED);
        drawLine(CX + tr, CY - tr / 2, CX + tr, CY - tr, COLORS.RED);
        drawLine(CX + tr, CY - tr, CX + tr / 2, CY - tr, COLORS.RED);
        drawLine(CX - tr, CY + tr / 2, CX - tr, CY + tr, COLORS.RED);
        drawLine(CX - tr, CY + tr, CX - tr / 2, CY + tr, COLORS.RED);
        drawLine(CX + tr, CY + tr / 2, CX + tr, CY + tr, COLORS.RED);
        drawLine(CX + tr, CY + tr, CX + tr / 2, CY + tr, COLORS.RED);
        let scanY = CY + Math.sin(g_phase * 4.0) * 115;
        fillRect(CX - 110, scanY - 2, 220, 4, COLORS.RED);
        drawText("AI_LOCK", CX, CY - 30, COLORS.RED);
      }

      function renderModeHome() {
        fillArc(CX, CY, 50, 49, 0, 360, COLORS.BLUE);
        fillArc(CX, CY, 100, 99, 0, 360, COLORS.BLUE);
        let scanA = g_phase * 2.0;
        fillTriangle(
          CX,
          CY,
          CX + Math.cos(scanA) * 120,
          CY + Math.sin(scanA) * 120,
          CX + Math.cos(scanA - 0.2) * 120,
          CY + Math.sin(scanA - 0.2) * 120,
          { r: 0, g: 50, b: 100 },
        );
        drawLine(
          CX,
          CY,
          CX + Math.cos(scanA) * 120,
          CY + Math.sin(scanA) * 120,
          COLORS.CYAN,
        );
        let nodes = [
          { a: 0.5, d: 55, nm: "LIV" },
          { a: 2.1, d: 95, nm: "KIT" },
          { a: 4.8, d: 80, nm: "BED" },
        ];
        nodes.forEach((n) => {
          let x = CX + Math.cos(n.a) * n.d,
            y = CY + Math.sin(n.a) * n.d;
          drawCircle(x, y, 4, COLORS.CYAN, true);
          drawText(n.nm, x, y - 10, COLORS.WHITE);
        });
      }

      function renderModeMedia() {
        let bars = 45,
          radius = 55;
        for (let i = 0; i < bars; i++) {
          let angle = ((i * 360.0) / bars) * DEG_TO_RAD + g_phase;
          let val =
            10 +
            Math.abs(Math.sin(g_phase * 4.0 + i * 0.4) * 45.0) +
            Math.sin(i * 132.0) * 5.0;
          let col = lerpColor(COLORS.PINK, COLORS.PURPLE, i / bars);
          drawLine(
            CX + Math.cos(angle) * radius,
            CY + Math.sin(angle) * radius,
            CX + Math.cos(angle) * (radius + val),
            CY + Math.sin(angle) * (radius + val),
            col,
            2,
          );
        }
        drawGlow(CX, CY, 25 + Math.sin(g_phase * 5.0) * 5.0, COLORS.PINK, 15);
        drawCircle(
          CX,
          CY,
          20 + Math.sin(g_phase * 5.0) * 5.0,
          COLORS.WHITE,
          true,
        );
      }

      function renderModeTimer() {
        let r = 80,
          angleEnd = ((ms_time % 60000) / 60000.0) * 360.0;
        fillArc(CX, CY, r, r - 5, 0, 360, { r: 50, g: 50, b: 0 });
        fillArc(CX, CY, r, r - 5, 0, angleEnd, COLORS.YELLOW);
        for (let i = 0; i < 12; i++) {
          let a = i * 30 * DEG_TO_RAD;
          drawCircle(
            CX + Math.cos(a) * (r + 15),
            CY + Math.sin(a) * (r + 15),
            3,
            COLORS.ORANGE,
            true,
          );
        }
        drawText("TIMER", CX, CY + 10, COLORS.WHITE, "24px");
      }

      function renderModeWeather() {
        drawGlow(CX, CY, 40, COLORS.YELLOW, 20);
        drawCircle(CX, CY, 40, COLORS.YELLOW, true);
        drawSegmentedRing(CX, CY, 60, 4, 8, g_phase * 20.0, 0.4, COLORS.YELLOW);
        drawText(local_text, CX, CY, COLORS.BG, "16px bold");
      }

      function renderModePrint() {
        drawRect(CX - 70, CY - 50, 140, 120, { r: 40, g: 45, b: 50 });
        let currentY = CY + 30 - ((Math.sin(g_phase * 0.2) + 1.0) / 2.0) * 60.0;
        drawLine(
          CX - 68,
          currentY - 20,
          CX + 68,
          currentY - 20,
          { r: 70, g: 75, b: 80 },
          1,
        );
        let bedY = CY + 40;
        drawGlow(CX, bedY, 50, COLORS.RED, 10);
        fillRect(CX - 60, bedY, 120, 6, { r: 120, g: 120, b: 120 });
        for (let y = bedY - 2; y >= currentY; y -= 3)
          drawLine(CX - 25, y, CX + 25, y, COLORS.GREEN);
        let nozzleX = CX + Math.sin(g_phase * 2.5) * 35.0;
        fillRect(nozzleX - 10, currentY - 25, 20, 15, {
          r: 180,
          g: 180,
          b: 190,
        });
        fillTriangle(
          nozzleX - 4,
          currentY - 10,
          nozzleX + 4,
          currentY - 10,
          nozzleX,
          currentY,
          COLORS.ORANGE,
        );
        drawLine(nozzleX, CY - 50, nozzleX, currentY - 25, COLORS.WHITE);

        let t = "--",
          b = "--",
          p = "--";
        if (local_text === "FLOTTE") {
          t = "N/A";
          b = "N/A";
          p = "FLOTTE";
        } else if (local_text.includes("|")) {
          let pts = local_text.split("|");
          t = pts[0];
          b = pts[1];
          p = pts[2];
        }
        drawText(`T: ${t}C`, CX - 40, CY - 60, COLORS.ORANGE);
        drawText(`B: ${b}C`, CX + 40, CY - 60, COLORS.RED);
        drawText(
          p !== "FLOTTE" && p !== "--" ? `${p}%` : p,
          CX,
          CY + 75,
          COLORS.CYAN,
        );
      }

      function renderModeMatrix() {
        ctx.font = "14px monospace";
        ctx.fillStyle = toCss(COLORS.GREEN);
        for (let i = 0; i < 18; i++) {
          ctx.fillText(
            Math.random() > 0.5 ? "1" : "0",
            (i * 20) % 240,
            (ms_time / 15 + i * 40) % 240,
          );
        }
      }

      function renderModeGhost() {
        drawCircle(CX, CY, 55 + Math.sin(g_phase) * 5, COLORS.DARK, true);
        fillArc(CX, CY, 110, 108, 0, 360, { r: 30, g: 30, b: 30 });
        for (let x = -60; x < 60; x += 3) {
          fillRect(
            CX + x,
            CY + Math.sin(x * 0.2 + g_phase) * 15,
            1,
            1,
            COLORS.GREY,
          );
        }
      }

      function renderModeError() {
        drawText(
          "ERROR",
          CX + (Math.random() * 10 - 5),
          CY + (Math.random() * 10 - 5),
          COLORS.RED,
          "24px",
        );
        for (let i = 0; i < 8; i++)
          fillRect(0, Math.random() * 240, 240, 4, { r: 150, g: 0, b: 0 });
      }

      function renderModeSuccess() {
        drawSegmentedRing(CX, CY, 85, 4, 1, 0, 0, COLORS.GREEN);
        drawLine(CX - 30, CY, CX - 5, CY + 25, COLORS.GREEN, 2);
        drawLine(CX - 29, CY, CX - 4, CY + 25, COLORS.WHITE);
        drawLine(CX - 5, CY + 25, CX + 40, CY - 30, COLORS.GREEN, 2);
        drawLine(CX - 4, CY + 25, CX + 41, CY - 30, COLORS.WHITE);
      }

      function renderModeWhatsapp() {
        drawSegmentedRing(CX, CY, 85, 4, 12, g_phase * 30.0, 0.3, COLORS.GREEN);
        drawGlow(CX, CY, 30 + Math.sin(g_phase * 4.0) * 5, COLORS.GREEN, 20);
        drawCircle(
          CX,
          CY,
          25 + Math.sin(g_phase * 4.0) * 5,
          { r: 10, g: 80, b: 20 },
          true,
        );
        drawText("MESSAGE", CX, CY - 40, COLORS.WHITE, "14px bold");
      }

      function renderDefaultLocked() {
        drawSegmentedRing(CX, CY, 100, 5, 4, g_phase * 50.0, 0.2, dyn_color);
        drawSegmentedRing(CX, CY, 80, 3, 8, -g_phase * 70.0, 0.4, COLORS.WHITE);
        drawText("LOCKED", CX, CY + 5, COLORS.WHITE, "16px");
      }

      // ==============================================================================
      // BOUCLE D'ANIMATION (Equivalent renderTask)
      // ==============================================================================
      let lastTime = 0;
      function renderLoop(timestamp) {
        if (timestamp - lastTime >= 33) {
          // Limitation ~30 FPS comme V7.2
          ms_time = timestamp;
          lastTime = timestamp;

          updateLogic();
          fillRect(0, 0, 240, 240, COLORS.BG); // clear screen

          switch (local_state) {
            case "IDLE":
            case "LISTENING":
            case "SPEAKING":
              renderOmniSphere();
              break;
            case "SYSTEM":
              renderModeSystem();
              break;
            case "VISION":
              renderModeVision();
              break;
            case "HOME":
              renderModeHome();
              break;
            case "GHOST":
              renderModeGhost();
              break;
            case "ERROR":
              renderModeError();
              break;
            case "SUCCESS":
              renderModeSuccess();
              break;
            case "MEDIA":
              renderModeMedia();
              break;
            case "WEATHER":
              renderModeWeather();
              break;
            case "TIMER":
              renderModeTimer();
              break;
            case "PRINT":
              renderModePrint();
              break;
            case "MATRIX":
              renderModeMatrix();
              break;
            case "SCREENSAVER":
              renderModeScreensaver();
              break;
            case "WHATSAPP":
              renderModeWhatsapp();
              break;
            default:
              renderDefaultLocked();
              break;
          }

          if (local_state !== "SCREENSAVER") renderPersistentHUD();
        }
        requestAnimationFrame(renderLoop);
      }

      // Interface UI Actions
      function setMode(mode) {
        local_state = mode;
        document
          .querySelectorAll("button")
          .forEach((b) => b.classList.remove("active"));
        event.target.classList.add("active");

        if (["IDLE", "LISTENING", "SPEAKING"].includes(mode))
          local_text = "STANDBY";
        else if (mode === "PRINT") local_text = "220|60|45";
        else if (mode === "WEATHER") local_text = "24 C";
        else if (mode === "WHATSAPP") local_text = "Maman";
        else local_text = "";

        document.getElementById("textInput").value = local_text;
      }

      function updateText() {
        const txt = document.getElementById("textInput").value.trim();
        if (txt) local_text = txt.substring(0, 60).toUpperCase();
      }

      requestAnimationFrame(renderLoop);
    </script>
  </body>
</html>
