<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ff6600" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#330000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#005577" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

  </defs>

  <rect width="500" height="500" fill="#0b0e14" rx="15"/>

  <g transform="translate(250, 220)">
    
    <circle r="160" stroke="#1c2833" stroke-width="4" fill="none" />
    <circle r="160" stroke="#00e5ff" stroke-width="2" stroke-dasharray="2 8" fill="none" opacity="0.4"/>

    <circle r="130" stroke="url(#ringGradient)" stroke-width="6" stroke-dasharray="60 15 10 15" fill="none" filter="url(#cyanGlow)"/>

    <circle r="105" stroke="#00aaff" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.6"/>

    <path d="M -130 0 L -180 0 M 130 0 L 180 0 M 0 -130 L 0 -180 M 0 130 L 0 180" stroke="#00e5ff" stroke-width="2" opacity="0.4" filter="url(#cyanGlow)"/>
    <path d="M -92 -92 L -127 -127 M 92 92 L 127 127 M -92 92 L -127 127 M 92 -92 L 127 -127" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>

    <circle r="85" fill="url(#coreGlow)" />

    <g opacity="0.7">
      <ellipse rx="75" ry="25" fill="none" stroke="#ffaa00" stroke-width="1.5" transform="rotate(0)" />
      <ellipse rx="75" ry="25" fill="none" stroke="#ffaa00" stroke-width="1.5" transform="rotate(45)" />
      <ellipse rx="75" ry="25" fill="none" stroke="#ffaa00" stroke-width="1.5" transform="rotate(90)" />
      <ellipse rx="75" ry="25" fill="none" stroke="#ffaa00" stroke-width="1.5" transform="rotate(135)" />
    </g>

    <circle r="40" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="1 12" opacity="0.6"/>

  </g>

<text x="250" y="430" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="34" font-weight="bold" fill="#ffffff" letter-spacing="12" filter="url(#cyanGlow)">J.A.R.V.I.S</text>

<text x="250" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#668899" letter-spacing="4">SYSTEM // NEURAL_CORE ONLINE</text>
</svg>
